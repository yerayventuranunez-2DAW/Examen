services:
  web:
    build: .
    container_name: php_web_examen
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.4
    container_name: mysql_db_examen
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: instituto
      MYSQL_USER: usuario
      MYSQL_PASSWORD: clave
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_examen:/var/lib/mysql

volumes:
  mysql_data_examen: